name: verify

on:
  pull_request:
  push:
    branches: [main, "v0.5/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # V0.5 intentionally uses install rather than ci until the historical
      # SUMI-era lockfile is regenerated against the modern Shell dependency.
      - run: npm install
      - run: npm run build
