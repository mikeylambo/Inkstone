<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INKSTONE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23dcd3be'/%3E%3Ctext x='16' y='25' font-size='26' text-anchor='middle' fill='%231c1917'%3E%E5%A2%A8%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body data-state="BOOT">
  <!-- Inkstone renderer + HUD stay Game DNA behind the ThreeAdapter. The shell
       owns the meta screens, which it mounts into #ui. The old hand-rolled
       #screen-* menus and #pause-menu are gone — the frame's flow is the
       screen set now. -->
  <div id="canvas-container"></div>

  <div class="paper-overlay"></div>
  <div class="ink-wash-vignette"></div>

  <!-- ============= RUN HUD (visible while playing, via body[data-state]) ===== -->
  <div id="hud">
    <div class="panel" id="vitals">
      <div class="panel-title">
        <span class="kanji">墨</span>
        <span>INK / VITALS</span>
        <span id="hp-text" class="mono">100 / 100</span>
      </div>
      <div class="bar"><div id="hp-bar" class="bar-fill hp"></div></div>
      <div class="panel-sub">
        <span id="lock-state">FREE</span>
        <span id="combo-count">0 STROKES</span>
      </div>
      <div class="panel-sub">
        <span id="run-mode">—</span>
        <span id="run-score">0</span>
      </div>
      <div class="panel-sub" id="pigment-slot" style="display:none">
        <span>PIGMENT</span>
        <span id="pigment-value">0%</span>
      </div>
    </div>

    <div id="version">INKSTONE</div>

    <div class="panel hidden" id="target-info">
      <div class="panel-title">
        <span class="kanji">鬼</span>
        <span id="target-name">ONI STAIN</span>
        <span id="target-state" class="mono">IDLE</span>
      </div>
      <div class="bar"><div id="target-hp-bar" class="bar-fill enemy"></div></div>
    </div>

    <div id="reticle"><div class="reticle-ring"></div><div class="reticle-dot"></div></div>

    <div class="panel" id="controls">
      <div><b>WASD</b> Move</div>
      <div><b class="c-ink">LMB / J</b> Light</div>
      <div><b class="c-gold">RMB / K</b> Launcher</div>
      <div><b class="c-red">MMB / L</b> Heavy · air = Dive</div>
      <div><b class="c-green">Space</b> Jump</div>
      <div><b class="c-green">Shift</b> Dash</div>
      <div><b class="c-blue">F</b> Parry</div>
      <div><b class="c-purple">Q / Tab</b> Lock-On (toggle)</div>
      <div><b>Esc</b> Pause</div>
    </div>

    <div id="hit-banner"></div>
    <div id="wave-banner"></div>
  </div>

  <button id="start-btn">始 &nbsp;BEGIN · ENABLE AUDIO</button>

  <!-- ================= DEATH beat (driven by the sim, kept as DNA) ========= -->
  <div id="screen-death" class="hidden">
    <div class="death-kanji">討</div>
  </div>

  <!-- ================== SHELL UI SHELL mounts its screens here ============= -->
  <div id="ui"></div>

  <div id="debug-panel" class="hidden"></div>

  <script type="module" src="/src/shell/main.ts"></script>
</body>
</html>
